{% extends "base.html" %}

{% block title %}Регистрация — Сервис рассылок{% endblock %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
    <h2>Регистрация</h2>
    
    <form method="post">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="id_username">Имя пользователя:</label>
            {{ form.username }}
        </div>
        
        <div class="form-group">
            <label for="id_email">Email:</label>
            {{ form.email }}
        </div>
        
        <div class="form-group">
            <label for="id_password1">Пароль:</label>
            {{ form.password1 }}
        </div>
        
        <div class="form-group">
            <label for="id_password2">Подтверждение пароля:</label>
            {{ form.password2 }}
        </div>
        
        <button type="submit" class="btn btn-success" style="width: 100%;">Зарегистрироваться</button>
    </form>
    
    <p style="text-align: center; margin-top: 15px;">
        Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a>
    </p>
</div>
{% endblock %}
