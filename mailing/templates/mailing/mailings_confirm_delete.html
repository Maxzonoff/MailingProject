{% extends "base.html" %}

{% block title %}Удаление рассылки{% endblock %}

{% block content %}
<div class="card">
    <h2>Удалить рассылку?</h2>
    <p>Вы уверены, что хотите удалить рассылку <strong>#{{ object.id }}</strong>?</p>
    <p>Сообщение: <strong>{{ object.message.subject }}</strong></p>
    <p>Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:mailing_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
