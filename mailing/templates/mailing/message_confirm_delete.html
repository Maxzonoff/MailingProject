{% extends "base.html" %}

{% block title %}Удаление сообщения{% endblock %}

{% block content %}
<div class="card">
    <h2>Удалить сообщение?</h2>
    <p>Вы уверены, что хотите удалить сообщение <strong>"{{ object.subject }}"</strong>?</p>
    <p>Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:message_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
