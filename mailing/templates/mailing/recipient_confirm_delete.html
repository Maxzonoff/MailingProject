{% extends "base.html" %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}
<div class="card">
    <h2>Удалить получателя?</h2>
    <p>Вы уверены, что хотите удалить получателя <strong>{{ object.full_name }} ({{ object.email }})</strong>?</p>
    <p>Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'mailing:mailing_recipient_list' %}" class="btn">Отмена</a>
    </form>
</div>
{% endblock %}
